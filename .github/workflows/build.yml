name: Build logbook PDF
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_lualatex: false
          args: -pdf -jobname=logbook -outdir=build -interaction=nonstopmode -file-line-error
      - uses: actions/upload-artifact@v4
        with:
          name: logbook-pdf
          path: build/logbook.pdf
